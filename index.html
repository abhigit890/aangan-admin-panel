<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aangan Admin</title>
<style>
  :root{
    --ink-bg:#100D08; --panel:#17130D; --line:rgba(200,155,74,0.22);
    --brass:#C89B4A; --brass-hi:#E8C878; --parchment:#EDE7DA; --dim:#8E8272;
    --teal:#4B7B73; --rose:#B85C6B; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--ink-bg); color:var(--parchment);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  h1,h2,h3{ font-family:Georgia,'Times New Roman',serif; font-weight:400; margin:0; }

  /* ================= LOGIN ================= */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(200,155,74,0.08), transparent 55%),
      var(--ink-bg);
  }
  #login-card{
    width:100%; max-width:360px; border:1px solid var(--line); border-radius:14px;
    padding:36px 28px; background:var(--panel);
  }
  #login-card .mark{ font-size:11px; letter-spacing:0.08em; color:var(--brass); margin-bottom:6px; }
  #login-card h1{ font-size:26px; color:var(--parchment); margin-bottom:4px; }
  #login-card p.sub{ font-size:12.5px; color:var(--dim); margin:0 0 26px; }
  #login-card label{ font-size:11px; color:var(--dim); display:block; margin:0 0 5px; }
  #login-card input{
    width:100%; padding:11px 12px; margin-bottom:16px; border-radius:8px;
    border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--parchment); font-size:15px;
  }
  #login-card button{
    width:100%; padding:12px; border-radius:8px; border:none;
    background:var(--brass); color:#1A1305; font-weight:700; font-size:14.5px; cursor:pointer; letter-spacing:0.02em;
  }
  #status-msg{ text-align:center; font-size:12.5px; color:var(--rose); min-height:16px; margin-top:10px; }

  /* ================= APP SHELL ================= */
  #shell{ display:none; min-height:100vh; }
  #sidebar{
    width:220px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
    padding:22px 0; display:flex; flex-direction:column;
  }
  #sidebar .brand{ padding:0 22px 22px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  #sidebar .brand .mark{ font-size:10.5px; letter-spacing:0.08em; color:var(--brass); }
  #sidebar .brand h1{ font-size:19px; color:var(--parchment); margin-top:2px; }
  .side-section{ font-size:10px; letter-spacing:0.06em; color:var(--dim); padding:14px 22px 6px; }
  .side-link{
    display:flex; align-items:center; gap:11px; padding:10px 22px; font-size:13.5px;
    color:var(--dim); cursor:pointer; border-left:2px solid transparent;
  }
  .side-link .ic{ font-size:16px; width:18px; text-align:center; }
  .side-link.active{ color:var(--brass-hi); background:rgba(200,155,74,0.07); border-left-color:var(--brass); }
  .side-link:hover{ color:var(--parchment); }
  #sidebar .switch-app{ margin-top:auto; padding:16px 22px 0; border-top:1px solid var(--line); }
  #sidebar .switch-app a{ font-size:12px; color:var(--dim); cursor:pointer; }

  #main{ flex:1; min-width:0; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line);
  }
  #topbar .crumb{ font-size:11px; color:var(--dim); }
  #topbar h2{ font-size:20px; color:var(--parchment); margin-top:2px; }
  #topbar .admin-tag{ font-size:12px; color:var(--dim); }
  #content{ padding:26px 28px 60px; }

  #shell.mobile-layout{ flex-direction:column; }
  @media (max-width: 760px){
    #shell{ flex-direction:column; }
    #sidebar{ width:100%; flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto; }
    #sidebar .brand{ display:none; }
    .side-section{ display:none; }
    .side-link{ padding:8px 12px; border-left:none; border-bottom:2px solid transparent; white-space:nowrap; }
    .side-link.active{ border-left-color:transparent; border-bottom-color:var(--brass); }
    #sidebar .switch-app{ display:none; }
    #content{ padding:18px 16px 50px; }
    #topbar{ padding:14px 16px; }
  }

  /* landing (choose app) */
  #app-picker{ display:flex; flex-direction:column; gap:14px; max-width:520px; }
  .picker-card{
    display:flex; align-items:center; gap:16px; padding:22px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--panel); cursor:pointer;
  }
  .picker-card .ic{ font-size:28px; }
  .picker-card .t{ font-size:15.5px; font-weight:600; color:var(--brass-hi); }
  .picker-card .s{ font-size:12px; color:var(--dim); margin-top:3px; }

  .section-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px; }
  .section-card{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--panel);
    padding:20px 16px; cursor:pointer;
  }
  .section-card .ic{ font-size:22px; margin-bottom:10px; }
  .section-card .t{ font-size:13.5px; font-weight:600; }
  .section-card .s{ font-size:11px; color:var(--dim); margin-top:4px; }

  /* ================= REMEDIES ================= */
  .toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap; }
  .cat-tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .cat-tab{
    padding:7px 15px; border-radius:20px; border:1px solid var(--line);
    background:transparent; color:var(--dim); font-size:12.5px; cursor:pointer;
  }
  .cat-tab.active{ background:var(--brass); color:#1A1305; border-color:var(--brass); font-weight:600; }
  .add-btn{
    width:36px; height:36px; border-radius:50%; background:var(--brass); color:#1A1305;
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; cursor:pointer; flex-shrink:0;
  }

  .remedy-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px; }
  .remedy-card{
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel);
  }
  .remedy-card .photo{ width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#000; }
  .remedy-card .photo.empty{ display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:11px; }
  .remedy-card .body{ padding:12px 14px 14px; }
  .remedy-card .name{ font-size:14px; font-weight:600; margin-bottom:3px; }
  .remedy-card .price{ font-size:12px; color:var(--brass-hi); }
  .remedy-card .row2{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .remedy-card .row2 span{ cursor:pointer; font-size:14px; color:var(--dim); }
  .empty-state{ color:var(--dim); font-size:13px; padding:40px 0; text-align:center; }

  /* ================= FORM MODAL ================= */
  #remedy-form-overlay{
    display:none; position:fixed; inset:0; background:rgba(8,6,3,0.85); z-index:50;
    align-items:center; justify-content:center; padding:20px;
  }
  #astro-form-overlay{
    display:none; position:fixed; inset:0; background:rgba(8,6,3,0.85); z-index:50;
    align-items:center; justify-content:center; padding:20px;
  }
  #remedy-form-overlay .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px;
    max-width:420px; width:100%; max-height:88vh; overflow-y:auto;
  }
  .modal h2{ font-size:18px; color:var(--brass-hi); margin-bottom:18px; }
  .modal label{ font-size:11px; color:var(--dim); display:block; margin:0 0 5px; }
  .modal input[type=text], .modal select, .modal textarea{
    width:100%; padding:11px 12px; margin-bottom:14px; border-radius:8px;
    border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--parchment); font-family:inherit; font-size:14px;
  }
  .modal input[type=file]{ width:100%; margin-bottom:8px; color:var(--parchment); font-size:12.5px; }
  #rf-photo-preview{
    width:100%; aspect-ratio:16/9; border-radius:8px; border:1px dashed var(--line); margin-bottom:14px;
    background:rgba(255,255,255,0.02); display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; overflow:hidden;
  }
  #rf-error{ color:var(--rose); font-size:12px; margin-bottom:10px; min-height:14px; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{ flex:1; padding:11px; border-radius:8px; font-size:14px; cursor:pointer; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--parchment); }
  .btn-solid{ background:var(--brass); border:none; color:#1A1305; font-weight:700; }
  .astro-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px; }
  .astro-card{
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel); padding:16px;
    text-align:center;
  }
  .astro-card .aphoto{ width:72px; height:72px; border-radius:50%; object-fit:cover; margin:0 auto 10px; display:block; border:2px solid var(--brass); }
  .astro-card .aphoto-empty{
    width:72px; height:72px; border-radius:50%; margin:0 auto 10px; background:rgba(200,155,74,0.12);
    display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--dim);
  }
  .astro-card .aname{ font-size:14px; font-weight:700; }
  .astro-card .aspec{ font-size:11.5px; color:var(--dim); margin-top:2px; }
  .astro-card .arow2{ display:flex; justify-content:space-between; margin-top:12px; }
  .astro-card .arow2 span{ cursor:pointer; font-size:13px; color:var(--dim); }
  .credentials-box{
    background:rgba(62,158,92,0.1); border:1px solid var(--teal); border-radius:10px; padding:14px; margin-top:14px; font-size:13px;
  }
  .credentials-box b{ color:var(--brass-hi); }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-card">
    <div class="mark">AANGAN</div>
    <h1>Admin</h1>
    <p class="sub">Sign in to the control panel</p>
    <label>Email</label>
    <input id="email" type="email" placeholder="you@aangan.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••">
    <button id="login-btn">Sign in</button>
    <div id="status-msg"></div>
  </div>
</div>

<div id="shell">
  <div id="sidebar">
    <div class="brand"><div class="mark">AANGAN</div><h1>Admin</h1></div>
    <div id="side-links"></div>
    <div class="switch-app"><a onclick="goHome()">← Switch app</a></div>
  </div>
  <div id="main">
    <div id="topbar">
      <div>
        <div class="crumb" id="crumb-text">Aangan Admin</div>
        <h2 id="topbar-title">Dashboard</h2>
      </div>
      <div class="admin-tag" id="admin-tag"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- ADD/EDIT REMEDY MODAL -->
<div id="remedy-form-overlay">
  <div class="modal">
    <h2 id="remedy-form-title">Add remedy</h2>
    <label>Category</label>
    <select id="rf-cat">
      <option value="pooja">Pooja</option>
      <option value="spell">Spell</option>
      <option value="gemstone">Gemstone</option>
      <option value="rudraksh">Rudraksh</option>
    </select>
    <label>Photo (16:9)</label>
    <input id="rf-photo" type="file" accept="image/*">
    <div id="rf-photo-preview">No photo selected</div>
    <label>Name</label>
    <input id="rf-name" type="text" placeholder="e.g. Griha Shanti Pooja">
    <label>Description</label>
    <textarea id="rf-desc" rows="4" placeholder="Full description of this remedy"></textarea>
    <label>Price</label>
    <input id="rf-price" type="text" placeholder="e.g. From ₹1,100">
    <div id="rf-error"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeRemedyForm()">Cancel</button>
      <button class="btn-solid" onclick="saveRemedy()">Save</button>
    </div>
  </div>
</div>

<!-- HIRE / EDIT ASTROLOGER MODAL -->
<div id="astro-form-overlay">
  <div class="modal">
    <h2 id="astro-form-title">Hire an Astrologer</h2>

    <label>Profile Photo</label>
    <input id="af-photo" type="file" accept="image/*">
    <div id="af-photo-preview" style="width:96px; height:96px; border-radius:50%; border:1px dashed var(--line); margin:0 auto 14px; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:11px; overflow:hidden; background:rgba(255,255,255,0.02);">No photo</div>

    <label>Full Name</label>
    <input type="text" id="af-name" placeholder="e.g. Guru Meera Devi">

    <label>Login Email <span style="color:var(--dim); font-weight:400;">(used to sign in to the astrologer app)</span></label>
    <input type="text" id="af-email" placeholder="astrologer@aangan.com">

    <label id="af-password-label">Login Password</label>
    <input type="text" id="af-password" placeholder="Set a password (min 6 characters)">

    <label>Specialty</label>
    <input type="text" id="af-specialty" placeholder="e.g. Vedic, Tarot, Numerology">

    <label>Languages</label>
    <input type="text" id="af-languages" placeholder="e.g. Hindi, English">

    <label>Price (₹ per minute)</label>
    <input type="text" id="af-price" placeholder="e.g. 25">

    <label>Experience (years)</label>
    <input type="text" id="af-experience" placeholder="e.g. 8">

    <label>About</label>
    <textarea id="af-about" rows="4" placeholder="A short bio for this astrologer's profile"></textarea>

    <div id="af-error"></div>
    <div id="af-credentials" class="credentials-box" style="display:none;"></div>

    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAstroForm()">Cancel</button>
      <button class="btn-solid" id="af-save-btn" onclick="saveAstrologer()">Hire Astrologer</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, createUserWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, query, where, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDubjcSirXbe4EJSFggYDveb4gVKUEElR0",
    authDomain: "aangan-ecosystem.firebaseapp.com",
    projectId: "aangan-ecosystem",
    storageBucket: "aangan-ecosystem.firebasestorage.app",
    messagingSenderId: "323610578849",
    appId: "1:323610578849:web:d0b6128870160a786b85e0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  window.db = db;

  // Secondary Firebase app instance — used only to create new astrologer
  // login accounts, so it doesn't sign the admin out of their own session.
  const secondaryApp = initializeApp(firebaseConfig, "AstrologerCreator");
  const secondaryAuth = getAuth(secondaryApp);

  const loginScreen = document.getElementById('login-screen');
  const shell = document.getElementById('shell');
  const statusMsg = document.getElementById('status-msg');

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    statusMsg.textContent = 'Signing in...';
    try {
      await signInWithEmailAndPassword(auth, email, password);
      statusMsg.textContent = '';
    } catch (err) {
      statusMsg.textContent = err.message;
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = 'none';
      shell.style.display = 'flex';
      document.getElementById('admin-tag').textContent = user.email;
      goHome();
    } else {
      loginScreen.style.display = 'flex';
      shell.style.display = 'none';
    }
  });

  // ---- Navigation state ----
  let currentApp = null; // 'user' | 'astro' | null (home)

  const NAV = {
    user: {
      title: "User App Control",
      links: [
        { id: 'remedies', label: 'Remedies List', icon: '🙏' },
        { id: 'helpchats', label: 'Help Chats', icon: '💬' },
        { id: 'live', label: 'Live Sessions', icon: '🔴' },
        { id: 'payments', label: 'Payments / Refunds', icon: '💳' },
      ]
    },
    astro: {
      title: "Astrologer App Control",
      links: [
        { id: 'astrologers', label: 'Astrologers', icon: '🧑‍🔮' },
        { id: 'tickets', label: 'Support Tickets', icon: '🎧' },
        { id: 'features', label: 'Features', icon: '⚙️' },
        { id: 'thresholds', label: 'Scoreboard Thresholds', icon: '📊' },
      ]
    }
  };

  window.goHome = function() {
    currentApp = null;
    document.getElementById('side-links').innerHTML = '';
    document.getElementById('crumb-text').textContent = 'Aangan Admin';
    document.getElementById('topbar-title').textContent = 'Dashboard';
    document.getElementById('content').innerHTML = `
      <div id="app-picker">
        <div class="picker-card" onclick="openApp('user')">
          <span class="ic">👤</span>
          <div><div class="t">User App Control</div><div class="s">Remedies, help chats, live sessions, payments</div></div>
        </div>
        <div class="picker-card" onclick="openApp('astro')">
          <span class="ic">🔮</span>
          <div><div class="t">Astrologer App Control</div><div class="s">Astrologers, support tickets, features</div></div>
        </div>
      </div>
    `;
  };

  window.openApp = function(appKey) {
    currentApp = appKey;
    const nav = NAV[appKey];
    document.getElementById('crumb-text').textContent = nav.title;
    document.getElementById('side-links').innerHTML = `
      <div class="side-section">Sections</div>
      ${nav.links.map(l => `<div class="side-link" data-id="${l.id}" onclick="openSection('${l.id}')"><span class="ic">${l.icon}</span>${l.label}</div>`).join('')}
    `;
    openSection(nav.links[0].id);
  };

  window.openSection = function(sectionId) {
    document.querySelectorAll('.side-link').forEach(l => l.classList.toggle('active', l.dataset.id === sectionId));
    const nav = NAV[currentApp];
    const link = nav.links.find(l => l.id === sectionId);
    document.getElementById('topbar-title').textContent = link ? link.label : '';

    if (sectionId === 'remedies') { renderRemediesSection(); return; }
    if (sectionId === 'tickets') { renderTicketsSection('astrologer'); return; }
    if (sectionId === 'helpchats') { renderTicketsSection('user'); return; }
    if (sectionId === 'astrologers') { renderAstrologersSection(); return; }

    document.getElementById('content').innerHTML = `<div class="empty-state">This section is coming soon.</div>`;
  };

  // ================= REMEDIES =================
  let currentRemedyCat = 'pooja';
  let remedyUnsub = null;
  let editingRemedyId = null;
  window.currentRemedyDocs = {};

  function renderRemediesSection() {
    document.getElementById('content').innerHTML = `
      <div class="toolbar">
        <div class="cat-tabs" id="remedy-cat-tabs">
          <button class="cat-tab active" data-cat="pooja">Pooja</button>
          <button class="cat-tab" data-cat="spell">Spell</button>
          <button class="cat-tab" data-cat="gemstone">Gemstone</button>
          <button class="cat-tab" data-cat="rudraksh">Rudraksh</button>
        </div>
        <div class="add-btn" id="add-remedy-btn">+</div>
      </div>
      <div class="remedy-grid" id="remedies-list"></div>
    `;
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
        tab.classList.add('active');
        currentRemedyCat = tab.dataset.cat;
        loadRemedies(currentRemedyCat);
      });
    });
    document.getElementById('add-remedy-btn').addEventListener('click', openAddRemedyForm);
    loadRemedies(currentRemedyCat);
  }

  function loadRemedies(cat) {
    const listEl = document.getElementById('remedies-list');
    if (!listEl) return;
    listEl.innerHTML = '<div class="empty-state">Loading...</div>';
    if (remedyUnsub) remedyUnsub();
    const q = query(collection(db, 'remedies'), where('cat', '==', cat));
    remedyUnsub = onSnapshot(q, (snap) => {
      if (snap.empty) {
        listEl.innerHTML = '<div class="empty-state">No remedies in this category yet.</div>';
        return;
      }
      listEl.innerHTML = '';
      snap.forEach(d => {
        const r = d.data();
        window.currentRemedyDocs[d.id] = r;
        const card = document.createElement('div');
        card.className = 'remedy-card';
        card.innerHTML = `
          ${r.photo ? `<img class="photo" src="${r.photo}">` : `<div class="photo empty">No photo</div>`}
          <div class="body">
            <div class="name">${r.name || ''}</div>
            <div class="price">${r.price || ''}</div>
            <div class="row2">
              <span onclick="editRemedy('${d.id}')">Edit</span>
              <span onclick="deleteRemedy('${d.id}')">Delete</span>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    });
  }

  function cacheRemedies(cat) {
    const q = query(collection(db, 'remedies'), where('cat', '==', cat));
    onSnapshot(q, (snap) => {
      snap.forEach(d => { window.currentRemedyDocs[d.id] = d.data(); });
    });
  }
  cacheRemedies('pooja'); cacheRemedies('spell'); cacheRemedies('gemstone'); cacheRemedies('rudraksh');

  const REMEDY_SEED = [
    { cat:"pooja", name:"Griha Shanti Pooja", desc:"To bring peace and remove negativity at home", price:"From ₹1,100" },
    { cat:"pooja", name:"Navgraha Shanti", desc:"A ritual to pacify the nine planets", price:"From ₹2,100" },
    { cat:"pooja", name:"Rudrabhishek Homa", desc:"A ritual homa for Lord Shiva's blessings", price:"From ₹2,500" },

    const snap = await new Promise(resolve => {

    });

  let pendingPhotoBase64 = null;

  document.body.addEventListener('change', (e) => {
    if (e.target.id !== 'rf-photo') return;
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const targetW = 480, targetH = 270;
        const canvas = document.createElement('canvas');
        canvas.width = targetW; canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        const srcRatio = img.width / img.height;
        const targetRatio = targetW / targetH;
        let sx, sy, sw, sh;
        if (srcRatio > targetRatio) {
          sh = img.height; sw = sh * targetRatio; sx = (img.width - sw) / 2; sy = 0;
        } else {
          sw = img.width; sh = sw / targetRatio; sx = 0; sy = (img.height - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
        pendingPhotoBase64 = canvas.toDataURL('image/jpeg', 0.75);
        document.getElementById('rf-photo-preview').innerHTML = `<img src="${pendingPhotoBase64}" style="width:100%; height:100%; object-fit:cover;">`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ================= SUPPORT TICKETS =================

  window.renderTicketsSection = function(role) {
    window.currentTicketRole = role;
    document.getElementById('content').innerHTML = `
      <div class="toolbar">
        <div class="cat-tabs" id="ticket-status-tabs">
          <button class="cat-tab active" data-status="open">Open</button>
          <button class="cat-tab" data-status="closed">Closed</button>
        </div>
      </div>
      <div id="tickets-list"></div>
    `;
    document.querySelectorAll('#ticket-status-tabs .cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#ticket-status-tabs .cat-tab').forEach(b => b.classList.remove('active'));
        tab.classList.add('active');
        loadTicketsList(role, tab.dataset.status);
      });
    });
    loadTicketsList(role, 'open');
  };

  function loadTicketsList(role, status) {
    const listEl = document.getElementById('tickets-list');
    if (!listEl) return;
    listEl.innerHTML = '<div class="empty-state">Loading...</div>';
    if (ticketListUnsub) ticketListUnsub();
    const q = query(collection(db, 'supportTickets'), where('role', '==', role), where('status', '==', status));
    ticketListUnsub = onSnapshot(q, (snap) => {
      if (snap.empty) {
        listEl.innerHTML = `<div class="empty-state">No ${status} tickets.</div>`;
        return;
      }
      const rows = [];
      snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
      rows.sort((a, b) => (b.ticketNumber || 0) - (a.ticketNumber || 0));
      listEl.innerHTML = rows.map(t => `
        <div class="remedy-row" style="cursor:pointer; display:block;" onclick="openTicketAdminChat('${t.id}', ${t.ticketNumber}, '${(t.raisedByName||'').replace(/'/g,"\\'")}')">
          <div style="display:flex; justify-content:space-between;">
            <span style="font-weight:700; font-size:13.5px;">#${t.ticketNumber} — ${t.raisedByName || 'Unknown'}</span>
          </div>
          <div style="font-size:12px; color:var(--dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${t.lastMessage || 'No messages yet'}</div>
        </div>
      `).join('');
    });
  }

  window.openTicketAdminChat = function(ticketId, ticketNumber, raisedByName) {
    window.currentAdminTicketId = ticketId;
    document.getElementById('content').innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
        <span style="cursor:pointer; font-size:18px; color:var(--brass-hi);" onclick="renderTicketsSection(window.currentTicketRole)">←</span>
        <div>
          <div style="font-weight:700; font-size:15px;">Ticket #${ticketNumber}</div>
          <div style="font-size:11.5px; color:var(--dim);">${raisedByName}</div>
        </div>
        <button style="margin-left:auto; padding:7px 14px; border-radius:8px; border:1px solid var(--rose); background:transparent; color:var(--rose); font-size:12px; cursor:pointer;" onclick="closeAdminTicket()">Close Ticket</button>
      </div>
      <div id="admin-ticket-body" style="display:flex; flex-direction:column; gap:8px; max-width:520px;"></div>
      <div style="display:flex; gap:8px; margin-top:16px; max-width:520px;">
        <input id="admin-ticket-input" type="text" placeholder="Type a reply..." style="flex:1; padding:11px 14px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--parchment); font-size:14px;">
        <button id="admin-ticket-send" style="width:42px; height:42px; border-radius:50%; border:none; background:var(--brass); color:#1A1305; font-size:16px; cursor:pointer;">➤</button>
      </div>
    `;
    if (ticketChatUnsub) ticketChatUnsub();
    const q = query(collection(db, 'supportTickets', ticketId, 'messages'), orderBy('sentAt', 'asc'));
    ticketChatUnsub = onSnapshot(q, (snap) => {
      const body = document.getElementById('admin-ticket-body');
      if (!body) return;
      if (snap.empty) { body.innerHTML = '<div class="empty-state">No messages yet.</div>'; return; }
      body.innerHTML = '';
      snap.forEach(d => {
        const m = d.data();
        const mine = m.senderType === 'admin';
        const row = document.createElement('div');
        row.style.cssText = `align-self:${mine ? 'flex-end' : 'flex-start'}; max-width:75%; padding:10px 14px; border-radius:12px; font-size:13.5px; background:${mine ? 'var(--brass)' : 'var(--card)'}; color:${mine ? '#1A1305' : 'var(--parchment)'}; border:1px solid var(--line);`;
        row.textContent = m.text || '';
        body.appendChild(row);
      });
      body.scrollTop = body.scrollHeight;
    });
    document.getElementById('admin-ticket-send').addEventListener('click', sendAdminTicketMsg);
    document.getElementById('admin-ticket-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAdminTicketMsg(); });
  };

  async function sendAdminTicketMsg() {
    const input = document.getElementById('admin-ticket-input');
    const text = input.value.trim();
    if (!text || !window.currentAdminTicketId) return;
    input.value = '';
    await addDoc(collection(db, 'supportTickets', window.currentAdminTicketId, 'messages'), {
      text, senderType: 'admin', sentAt: serverTimestamp()
    });
    await updateDoc(doc(db, 'supportTickets', window.currentAdminTicketId), {
      lastMessage: text, lastMessageAt: serverTimestamp()
    });
  }

  window.closeAdminTicket = async function() {
    if (!window.currentAdminTicketId) return;
    if (!confirm('Mark this ticket as closed?')) return;
    await updateDoc(doc(db, 'supportTickets', window.currentAdminTicketId), { status: 'closed' });
    await addDoc(collection(db, 'supportTickets', window.currentAdminTicketId, 'messages'), {
      text: 'This ticket has been closed by admin.', senderType: 'system', sentAt: serverTimestamp()
    });
  };

  function loadAstrologers() {

      if (snap.empty) {
        grid.innerHTML = '<div class="empty-state">No astrologers hired yet.</div>';
        return;
      }
      grid.innerHTML = '';
      snap.forEach(d => {
        const a = d.data();
        window.currentAstroDocs[d.id] = a;
        if (!a.name && !a.specialty) return; // skip bare test/chat-only accounts with no profile set up
        const card = document.createElement('div');
        card.className = 'astro-card';
        card.innerHTML = `
          ${a.profilePhoto ? `<img class="aphoto" src="${a.profilePhoto}">` : `<div class="aphoto-empty">🧑‍🔮</div>`}

          <div class="arow2">
            <span onclick="editAstrologer('${d.id}')">Edit</span>

        grid.appendChild(card);

      if (!grid.innerHTML) grid.innerHTML = '<div class="empty-state">No astrologers hired yet.</div>';

  document.getElementById('af-photo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const size = 300;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        pendingAstroPhoto = canvas.toDataURL('image/jpeg', 0.8);
        document.getElementById('af-photo-preview').innerHTML = `<img src="${pendingAstroPhoto}" style="width:100%; height:100%; object-fit:cover;">`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  window.saveAstrologer = async function() {
    const name = document.getElementById('af-name').value.trim();
    const email = document.getElementById('af-email').value.trim();
    const password = document.getElementById('af-password').value;
    const specialty = document.getElementById('af-specialty').value.trim();
    const languages = document.getElementById('af-languages').value.trim();
    const price = document.getElementById('af-price').value.trim();
    const experienceYears = document.getElementById('af-experience').value.trim();
    const about = document.getElementById('af-about').value.trim();
    const errEl = document.getElementById('af-error');
    errEl.textContent = '';

    if (!name || !specialty) {
      errEl.textContent = 'Name and specialty are required.';
      return;
    }

    const profileData = { name, specialty, languages, price, experienceYears, about, updatedAt: serverTimestamp() };
    if (pendingAstroPhoto) profileData.profilePhoto = pendingAstroPhoto;

    try {
      if (editingAstroUid) {
        await updateDoc(doc(db, 'astrologers', editingAstroUid), profileData);
        closeAstroForm();
        return;
      }

      // Hiring a new astrologer: validate login fields first
      if (!email || !password) {
        errEl.textContent = 'Login email and password are required to hire a new astrologer.';
        return;
      }
      if (password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        return;
      }

      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
      const newUid = cred.user.uid;
      await signOut(secondaryAuth); // don't leave the secondary session signed in

      await setDoc(doc(db, 'astrologers', newUid), {
        ...profileData, email, chatOnline: false, callOnline: false, videoOnline: false,
        createdAt: serverTimestamp()
      }, { merge: true });

      document.getElementById('af-credentials').style.display = 'block';
      document.getElementById('af-credentials').innerHTML = `
        <b>Astrologer hired!</b><br>
        Share these login details with them:<br>
        Email: <b>${email}</b><br>
        Password: <b>${password}</b>
      `;
      document.getElementById('af-save-btn').style.display = 'none';
    } catch (e) {
      errEl.textContent = 'Error: ' + e.message;
    }
  };
